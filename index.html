// ── MODULE VIEWER ────────────────────────────────────────────────────────────
function vModule(){
  const m = MODULES[CUR_MOD];
  const done = isModuleDone(m.id);
  const isLast = CUR_MOD === MODULES.length-1;
  let gate;
  if(m.gate === 'none'){
    gate = renderNoneGate(m, done);
  } else if(m.gate === 'stub'){
    gate = renderStubGate(m, done);
  } else {
    gate = renderQuiz(m, done);
  }
  return `<div class="module-page">
    <div class="r-eyebrow">Module ${CUR_MOD+1} of ${MODULES.length}</div>
    <div class="r-title">${m.ic} ${m.title}</div>
    <div class="r-sub">${m.sub}</div>
    <div class="r-meta">~${m.min} min${m.gate==='stub'?' &middot; content still being finalized — see amber notes below':''}</div>
    <div class="reader">${m.body}</div>
    ${gate}
    <div class="mod-nav-row">
      <button class="btn btn-ghost" onclick="backToPath()">&larr; Back to path</button>
      ${done ? `<button class="btn btn-secondary" onclick="continueFromModule()">${isLast ? 'Back to path' : 'Continue to next module'} &rarr;</button>` : ''}
    </div>
  </div>`;
}

// -- 'none' gate: real, finished content with no comprehension check by
// design (e.g. the Welcome module) -- just an explicit "mark complete" step
// so it still participates in gating/progress like every other module.
function renderNoneGate(m, done){
  if(done){
    return `<div class="stub-gate"><div class="pill pill-green">&#10003; Completed</div></div>`;
  }
  return `<div class="stub-gate">
    <button class="btn btn-primary" style="width:auto;" onclick="completeNone('${m.id}')">Continue &rarr;</button>
  </div>`;
}
function completeNone(id){
  ME.doneIds.add(id);
  saveProgress(id, 'done', ''); // fire-and-forget -- don't block the UI on a slow PA response
  renderView();
}

// -- stub gate (blocked modules): single acknowledgement checkbox --
function renderStubGate(m, done){
  if(done){
    return `<div class="stub-gate"><div class="pill pill-green">&#10003; Reviewed</div></div>`;
  }
  const checked = !!stubChecked[m.id];
  return `<div class="stub-gate">
    <div class="locked-note" style="margin-top:0;margin-bottom:14px;">&#9432; This module's full content is still being finalized (see the amber notes above). This is a placeholder gate — it will be replaced with a real knowledge check once the content lands, without resetting your progress.</div>
    <label class="stub-check" onclick="event.preventDefault();toggleStub('${m.id}')">
      <div class="stub-box${checked?' on':''}"></div>
      <div class="stub-label">I've reviewed this section.</div>
    </label>
    <button class="btn btn-primary" style="width:auto;margin-top:14px;" ${checked?'':'disabled'} onclick="completeStub('${m.id}')">Mark complete &amp; continue &rarr;</button>
  </div>`;
}
function toggleStub(id){ stubChecked[id] = !stubChecked[id]; persistLocal(); renderView(); }
function completeStub(id){
  if(!stubChecked[id]) return;
  ME.doneIds.add(id);
  saveProgress(id, 'done', ''); // fire-and-forget
  toast('Section marked complete.');
  renderView();
}

// -- real per-module quiz (one question at a time, flagged not blocking).
// Same single-question view whether or not the module is already done --
// once done, options just stop being clickable and the Finish button is
// replaced with a "Completed" pill. Back/dot-jump navigation always works,
// so reviewing past answers never expands into a big list -- matches the
// Maple pattern this was modeled on.
function renderQuiz(m, done){
  const qs = getModQuestions(m.id);
  if(qs.length === 0){
    // safety net: a real module with no quiz defined yet behaves like a stub
    return renderStubGate(m, done);
  }
  if(!quizIdx[m.id]) quizIdx[m.id] = 0;
  if(!quizAnswers[m.id]) quizAnswers[m.id] = {};
  const idx = quizIdx[m.id];
  const q = qs[idx];
  const picked = quizAnswers[m.id][idx];
  const answered = picked !== undefined;
  const allAnswered = qs.every((_,i)=> quizAnswers[m.id][i] !== undefined);
  const dots = qs.map((_,i)=>{
    const ans = quizAnswers[m.id][i] !== undefined;
    return `<div class="quiz-dot${i===idx?' active':''}${ans?' answered':''}"${ans?` onclick="jumpQuizQ('${m.id}',${i})" style="cursor:pointer;"`:''}></div>`;
  }).join('');
  const opts = q.opts.map((o,oi)=>{
    let cls = 'quiz-opt';
    if(answered){
      if(oi===q.a) cls += ' correct';
      else if(oi===picked) cls += ' incorrect';
    }
    // Once the module is done, answers are committed -- render as plain,
    // non-interactive divs instead of buttons so reviewing never changes
    // what was actually submitted.
    return done
      ? `<div class="${cls}" style="cursor:default;">${o}</div>`
      : `<button class="${cls}" onclick="answerQuiz('${m.id}',${idx},${oi})">${o}</button>`;
  }).join('');
  const fbClass = answered ? (picked===q.a ? ' correct' : ' incorrect') : '';
  const fb = answered ? `<div class="quiz-fb${fbClass}">${picked===q.a ? '&#10003; Correct.' : '&#10007; Not quite — the highlighted option is correct.'}</div>` : (done ? `<div class="quiz-fb">Answer not available to review on this device.</div>` : '');
  const backBtn = idx > 0 ? `<button class="btn btn-ghost" style="width:auto;margin-top:14px;margin-right:8px;" onclick="prevQuizQ('${m.id}')">&larr; Back</button>` : '';
  let nav;
  if(done){
    nav = idx < qs.length-1
      ? `<button class="btn btn-secondary" style="width:auto;margin-top:14px;" onclick="nextQuizQ('${m.id}',${qs.length})">Next question &rarr;</button>`
      : '';
  } else {
    nav = idx < qs.length-1
      ? `<button class="btn btn-secondary" style="width:auto;margin-top:14px;" ${answered?'':'disabled'} onclick="nextQuizQ('${m.id}',${qs.length})">Next question &rarr;</button>`
      : `<button class="btn btn-primary" style="width:auto;margin-top:14px;" ${allAnswered?'':'disabled'} onclick="completeQuiz('${m.id}')">Finish module &rarr;</button>`;
  }
  const progressLine = done
    ? `<div class="quiz-progress">Knowledge check &middot; question ${idx+1} of ${qs.length} &middot; <span style="color:var(--green-text);font-weight:600;">&#10003; Completed</span></div>`
    : `<div class="quiz-progress">Knowledge check &middot; question ${idx+1} of ${qs.length}</div>`;
  return `<div class="quiz-card">
    ${progressLine}
    <div class="quiz-dots">${dots}</div>
    <div class="quiz-q">${q.q}</div>
    ${opts}${fb}
    <div style="display:flex;gap:8px;flex-wrap:wrap;">${backBtn}${nav}</div>
  </div>`;
}
function answerQuiz(id, qi, oi){ quizAnswers[id][qi] = oi; persistLocal(); renderView(); }
function nextQuizQ(id, total){ quizIdx[id] = Math.min(total-1, (quizIdx[id]||0)+1); renderView(); }
function prevQuizQ(id){ quizIdx[id] = Math.max(0, (quizIdx[id]||0)-1); renderView(); }
function jumpQuizQ(id, i){ if(quizAnswers[id] && quizAnswers[id][i] !== undefined){ quizIdx[id] = i; renderView(); } }
function completeQuiz(id){
  ME.doneIds.add(id);
  saveProgress(id, 'done', ''); // fire-and-forget
  toast('Module complete.');
  renderView();
}

// ── FINAL CHECK (score-gated certification exam) ────────────────────────────
function openFinalCheck(){ finalMode='inprogress'; finalIdx=0; finalAnswers={}; finalResult=null; VIEW='final'; renderNavTabsForFinal(); }
function renderNavTabsForFinal(){
  document.getElementById('content').innerHTML = vFinal();
  window.scrollTo(0,0);
}
function vFinal(){
  if(finalMode==='result'){
    const pass = finalResult.pct >= FINAL_CHECK_PASS_PCT;
    return `<div class="module-page">
      <div class="r-eyebrow">Final Check</div>
      <div class="r-title">${pass ? 'Passed' : 'Not yet'} &middot; ${finalResult.pct}%</div>
      <div class="r-sub">${finalResult.correct} of ${finalResult.total} correct &middot; ${FINAL_CHECK_PASS_PCT}% needed to pass</div>
      ${pass ? `<div class="callout"><div class="c-ic">&#9733;</div><div class="c-tx">You're cleared for on-site training. Your Project Manager will confirm the date.</div></div>`
             : `<div class="callout warn"><div class="c-ic">&#9888;</div><div class="c-tx">No limit on retakes — review the modules above and try again whenever you're ready.</div></div>`}
      <button class="btn btn-secondary" style="width:auto;margin-top:14px;" onclick="backToPath()">Back to Learning Path</button>
      ${pass?'':'<button class="btn btn-primary" style="width:auto;margin-top:14px;margin-left:10px;" onclick="openFinalCheck()">Retake &rarr;</button>'}
    </div>`;
  }
  const q = FINAL_CHECK[finalIdx];
  const picked = finalAnswers[finalIdx];
  const answered = picked !== undefined;
  const dots = FINAL_CHECK.map((_,i)=>{
    const ans = finalAnswers[i] !== undefined;
    return `<div class="quiz-dot${i===finalIdx?' active':''}${ans?' answered':''}"${ans?` onclick="jumpFinal(${i})" style="cursor:pointer;"`:''}></div>`;
  }).join('');
  const opts = q.opts.map((o,oi)=>{
    let cls='quiz-opt';
    if(answered){ if(oi===q.a) cls+=' correct'; else if(oi===picked) cls+=' incorrect'; }
    return `<button class="${cls}" onclick="answerFinal(${oi})">${o}</button>`;
  }).join('');
  const fbClass2 = answered ? (picked===q.a ? ' correct' : ' incorrect') : '';
  const fb = answered ? `<div class="quiz-fb${fbClass2}">${picked===q.a?'&#10003; Correct.':'&#10007; Not quite — the highlighted option is correct.'}</div>` : '';
  const backBtn2 = finalIdx > 0 ? `<button class="btn btn-ghost" style="width:auto;margin-top:14px;margin-right:8px;" onclick="prevFinal()">&larr; Back</button>` : '';
  const nav = finalIdx < FINAL_CHECK.length-1
    ? `<button class="btn btn-secondary" style="width:auto;margin-top:14px;" ${answered?'':'disabled'} onclick="nextFinal()">Next &rarr;</button>`
    : `<button class="btn btn-primary" style="width:auto;margin-top:14px;" ${answered?'':'disabled'} onclick="submitFinal()">See result &rarr;</button>`;
  return `<div class="module-page">
    <div class="r-eyebrow">Final Check &middot; question ${finalIdx+1} of ${FINAL_CHECK.length}</div>
    <div class="r-title" style="font-size:20px;">Scenario check</div>
    <div class="locked-note" style="margin-bottom:18px;">&#9432; Six of ten planned questions are live today; four more are held back until their underlying policies (neighbor/police protocol, contact channel, payment terms) are finalized — they'll be added without resetting anyone's progress.</div>
    <div class="quiz-card">
      <div class="quiz-dots">${dots}</div>
      <div class="quiz-q">${q.q}</div>
      ${opts}${fb}
      <div style="display:flex;gap:8px;flex-wrap:wrap;">${backBtn2}${nav}</div>
    </div>
  </div>`;
}
function answerFinal(oi){ finalAnswers[finalIdx]=oi; renderNavTabsForFinal(); }
function nextFinal(){ finalIdx = Math.min(FINAL_CHECK.length-1, finalIdx+1); renderNavTabsForFinal(); }
function prevFinal(){ finalIdx = Math.max(0, finalIdx-1); renderNavTabsForFinal(); }
function jumpFinal(i){ if(finalAnswers[i] !== undefined){ finalIdx = i; renderNavTabsForFinal(); } }
function submitFinal(){
  let correct=0;
  FINAL_CHECK.forEach((q,i)=>{ if(finalAnswers[i]===q.a) correct++; });
  const pct = Math.round((correct/FINAL_CHECK.length)*100);
  finalResult = {correct, total: FINAL_CHECK.length, pct};
  ME.finalScore = pct;
  saveProgress('final_check', 'done', pct); // fire-and-forget
  finalMode = 'result';
  renderNavTabsForFinal();
}

  <h2 style="font-size:17px;font-weight:600;margin:0 0 12px;">On-site checklist</h2>
  ${sections}
  <div id="fr-scripts">${scripts}</div>
  <h2 id="fr-tree" style="font-size:17px;font-weight:600;margin:28px 0 6px;">Troubleshooting decision tree</h2>
  ${treeRows}
  <h2 id="fr-esc" style="font-size:17px;font-weight:600;margin:28px 0 6px;">Escalation tiers</h2>
  <table class="tbl"><tr><th>Tier</th><th>What it covers</th></tr>${escRows}</table>
  <h2 id="fr-contacts" style="font-size:17px;font-weight:600;margin:28px 0 6px;">Who to contact</h2>
  ${contactCards}
  `;
}
function toggleChecklistSection(id){ checklistOpen[id] = !checklistOpen[id]; persistLocal(); renderView(); }
function toggleFieldCheck(sid, ii){ const k='done_'+sid+ii; checklistOpen[k]=!checklistOpen[k]; persistLocal(); renderView(); }

// ── RESOURCES TAB ────────────────────────────────────────────────────────────

  const items = [
    {ic:'&#128193;', t:'Moderator SharePoint', d:'Project Twilight Moderators site — the SOP and project documents live here. Sign in with your Centific credentials.', href:'https://digitaltechedge.sharepoint.com/sites/Project_Twilight_Moderators', pending:false},
    {ic:'&#128203;', t:'Twilight App', d:'Your source of truth in the field — assignments, SOP, and close-out.', href:'#', pending:true},
    {ic:'&#128241;', t:'Ring login', d:'Camera platform login.', href:'#', pending:true},
    {ic:'&#128241;', t:'Lakitu login', d:'Session/tooling platform login.', href:'#', pending:true},
    {ic:'&#128196;', t:'Project Twilight SOP', d:'Governs the night-time outdoor video collection process. On the Moderator SharePoint — read it as soon as you have access.', href:'https://digitaltechedge.sharepoint.com/sites/Project_Twilight_Moderators', pending:false},
    {ic:'&#128295;', t:'Hardware Troubleshooting reference', d:'Full decision tree. Covered at in-person training; reference to follow on the Moderator SharePoint.', href:'#', pending:true},

// ── ADMIN DASHBOARD ──────────────────────────────────────────────────────────
function vDash(){
  const total = COHORT.length;
  const certified = COHORT.filter(c=>c.status==='certified').length;
  const inProgress = COHORT.filter(c=>c.status==='in_progress').length;
  const awaitingFinal = COHORT.filter(c=>c.status==='awaiting_final').length;
  const filtered = COHORT.filter(c => adminFilter==='all' ? true : c.status===adminFilter);
  const rows = filtered.map(c => {
    const pct = Math.round((c.done/MODULES.length)*100);
    const pillMap = {not_started:['pill-gray','Not started'], in_progress:['pill-blue','In progress'], awaiting_final:['pill-amber','Awaiting final check'], certified:['pill-green','Certified']};
    const [pc,pt] = pillMap[c.status];
    return `<tr>
      <td><div class="mod-row-name"><div class="mod-avatar">${c.name.charAt(0)}</div><div><div style="font-weight:600;">${c.name}</div><div style="font-size:11.5px;color:var(--text3);">${c.email}</div></div></div></td>
      <td>${c.done} / ${MODULES.length} (${pct}%)</td>
      <td>${c.finalScore===null?'—':c.finalScore+'%'}</td>
      <td><span class="pill ${pc}">${pt}</span></td>
    </tr>`;
  }).join('');
  return `<h1 class="page-h1">Cohort Dashboard</h1><p class="page-sub">Twilight moderators &middot; Redmond, WA</p>
  <div class="kpi-grid">
    <div class="kpi-card"><div class="kpi-val">${total}</div><div class="kpi-lbl">Enrolled</div></div>
    <div class="kpi-card"><div class="kpi-val">${inProgress}</div><div class="kpi-lbl">In progress</div></div>
    <div class="kpi-card"><div class="kpi-val">${awaitingFinal}</div><div class="kpi-lbl">Awaiting final check</div></div>
    <div class="kpi-card"><div class="kpi-val">${certified}</div><div class="kpi-lbl">Certified</div></div>
  </div>
  <div class="filter-row">
    ${[['all','All'],['in_progress','In progress'],['awaiting_final','Awaiting final'],['certified','Certified']].map(([k,l])=>
      `<button class="filter-chip${adminFilter===k?' active':''}" onclick="setAdminFilter('${k}')">${l}</button>`).join('')}
  </div>
  <div class="card"><table class="admin-tbl"><tr><th>Moderator</th><th>Modules</th><th>Final check</th><th>Status</th></tr>${rows||'<tr><td colspan="4" style="color:var(--text3);">No moderators match this filter.</td></tr>'}</table></div>`;
}
function setAdminFilter(f){ adminFilter=f; renderView(); }

function vCurriculum(){
  const rows = MODULES.map((m,i) => {
    const qs = getModQuestions(m.id);
    const editable = qs.length > 0;
    const gateLabel = m.gate==='stub' ? '<span class="pill pill-amber" style="margin-left:6px;">Partial content</span>'
                     : (editable ? '<span class="pill pill-green" style="margin-left:6px;">Ready</span>' : '<span class="pill pill-gray" style="margin-left:6px;">No check</span>');
    const open = !!curriculumEditOpen[m.id];
    return `<div class="res-card" style="cursor:default;flex-direction:column;align-items:stretch;">
      <div style="display:flex;align-items:center;gap:14px;">
        <div class="res-ic">${m.ic}</div>
        <div class="res-tx" style="flex:1;"><h4>${i+1}. ${m.title} ${gateLabel}</h4><p>~${m.min} min &middot; ${qs.length} question${qs.length===1?'':'s'}</p></div>
        ${editable ? `<button class="btn btn-ghost" onclick="toggleCurriculumEdit('${m.id}')">${open?'Hide':'Edit'} questions</button>` : ''}
      </div>
      ${editable && open ? `<div style="margin-top:14px;">${qs.map((q,qi)=>renderEditableQuestion('mod:'+m.id, qi, q)).join('')}</div>` : ''}
    </div>`;
  }).join('');
  const finalOpen = !!curriculumEditOpen['final'];
  return `<h1 class="page-h1">Curriculum</h1><p class="page-sub">${MODULES.length} modules, sequential and gated &middot; two-layer knowledge check (per-module + final) &middot; ~${TOTAL_MIN} min total</p>
  <div class="callout" style="margin-bottom:18px;"><div class="c-ic">&#9432;</div><div class="c-tx"><strong>Question and answer text below is editable.</strong> Changes save to this browser only until the Curriculum backend is wired — see Dev_Notes.md. <button class="btn btn-ghost" style="margin-left:4px;" onclick="resetCurriculum()">Reset all to defaults</button></div></div>
  ${rows}
  <div class="res-card" style="cursor:default;flex-direction:column;align-items:stretch;margin-top:6px;">
    <div style="display:flex;align-items:center;gap:14px;">
      <div class="res-ic">&#127919;</div>
      <div class="res-tx" style="flex:1;"><h4>Final Check <span class="pill pill-blue" style="margin-left:6px;">${FINAL_CHECK.length} of 10 planned</span></h4><p>${FINAL_CHECK_PASS_PCT}% to pass &middot; unlimited retakes &middot; 4 more held pending policy decisions</p></div>
      <button class="btn btn-ghost" onclick="toggleCurriculumEdit('final')">${finalOpen?'Hide':'Edit'} questions</button>
    </div>
    ${finalOpen ? `<div style="margin-top:14px;">${FINAL_CHECK.map((q,qi)=>renderEditableQuestion('final', qi, q)).join('')}</div>` : ''}
  </div>`;
}

// ── BOOT ─────────────────────────────────────────────────────────────────────
// Local-file warning: modern Chrome/Edge block outbound fetch() from a
// file:// origin to remote HTTPS endpoints, so BACKEND calls silently never
// leave the browser when someone double-clicks this file instead of opening
// it from a hosted URL. That looks identical to "the flow is broken" (zero
// Power Automate run history) but is actually a browser restriction, not an
// app or flow bug. Appended to <html> (a sibling of <body>), not inside
// <body>, so it survives every full-body innerHTML re-render.
if(location.protocol === 'file:'){
  const w = document.createElement('div');
  w.style.cssText = 'position:fixed;top:0;left:0;right:0;z-index:9999;background:#F59E0B;color:#1a1207;font-family:-apple-system,\'SF Pro Text\',sans-serif;font-size:12.5px;font-weight:600;padding:9px 16px;text-align:center;box-shadow:0 2px 10px rgba(0,0,0,.25);';
  w.textContent = '⚠ Opened as a local file (file://) — network calls to Power Automate are blocked by the browser from this origin, so progress will not sync. Open this from a hosted URL (e.g. GitHub Pages) to test the live backend.';
  document.documentElement.appendChild(w);
}

// Prefetch starts the instant the page loads (not on a click) -- see
// canonical pattern in Verdi_App_Family_Master_Context.md §20.1. If there's
// no auto-resume candidate, show the login screen immediately rather than
// waiting on the network; doLogin() awaits the same in-flight promise.
loadCurriculumOverrides();
if(!getLastLogin()) renderLogin();
loadData().then(() => {
  const last = getLastLogin();
  if(last){
    const rec = findUser(last);
    if(rec){ applyProfile(rec); restoreLocalSession(last); startApp(rec.role); }
    else { renderLogin(); }
  }
});

</script>
