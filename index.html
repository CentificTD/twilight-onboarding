// FLAG BEFORE PRODUCTION DEPLOY: DEMO_DIRECTORY and the "Demo accounts:" hint
// on the login screen are intentionally left in for now (per direct
// instruction) so this file is testable the moment it's handed over. Remove
// both -- this const and the hint-line in renderLogin() -- before real
// moderators start using a live-wired build. See Team_Handoff.md action items.
const DEMO_DIRECTORY = [{"email": "test.mod@centific.com", "name": "Test Moderator", "role": "moderator", "loc": "Redmond, WA", "tz": "PT", "active": "yes"}, {"email": "test.admin@centific.com", "name": "Test Admin", "role": "admin", "loc": "Redmond, WA", "tz": "PT", "active": "yes"}, {"email": "v-jordan.reyes@centific.com", "name": "Jordan Reyes", "role": "moderator", "loc": "Redmond, WA", "tz": "PT", "active": "yes"}, {"email": "v-priya.nandi@centific.com", "name": "Priya Nandi", "role": "moderator", "loc": "Redmond, WA", "tz": "PT", "active": "yes"}, {"email": "v-marcus.oyelaran@centific.com", "name": "Marcus Oyelaran", "role": "moderator", "loc": "Redmond, WA", "tz": "PT", "active": "yes"}];
const MODULES = [{"id": "welcome", "ic": "&#127769;", "title": "Welcome to Twilight", "sub": "What this course covers and what to expect before we start.", "min": 3, "body": "\n<p>Welcome — you're about to start onboarding for Project Twilight. Before anything else, here's the shape of what you're signing up for and how this course works.</p>\n\n<h2>What Twilight is, in one paragraph</h2>\n<p>Twilight is a nighttime video data capture project. You'll drive to a participant's property after dark, set up a camera kit covering the yard and driveway, run a set of scenarios to a fixed specification, pack down, and leave. The next module goes deep on what Centific does and why; the module after that covers Twilight itself in full. This is just enough to orient you before that.</p>\n\n<h2>How this course works</h2>\n<ul>\n<li><strong>Modules unlock in order.</strong> Each one opens after you finish the one before it. You can always go back and re-read anything you've already completed.</li>\n<li><strong>Most modules end with a short knowledge check</strong> — a few questions to confirm you're reading, not clicking through. Answers are flagged, not blocking, except for the final check.</li>\n<li><strong>A few modules are still being finished</strong> by other teams as you go through this — you'll see them marked clearly, with a simple \"I've reviewed this\" checkbox standing in until the real content and questions are ready. Nothing about that is hidden from you.</li>\n<li><strong>A final scenario check</strong> comes after every module is complete — that's what actually certifies you for on-site training.</li>\n<li><strong>A Field Reference tab</strong> becomes available once you're in the app — keep it open on your phone during an actual session for quick access to scripts, escalation steps, and troubleshooting, without digging back through training content.</li>\n</ul>\n\n<div class=\"callout\"><div class=\"c-ic\">&#9432;</div><div class=\"c-tx\">If anything in this course is unclear, or a link looks broken, that's useful to know — route it to Ingrid Lindstrom (Training &amp; Development). You'll get her contact details, along with everyone else's, in the next couple of modules.</div></div>\n\n<p>Ready? Next up: who Centific actually is, and what your role means in practice.</p>\n", "gate": "none"}, {"id": "centific", "ic": "&#127760;", "title": "Who Is Centific", "sub": "Who we are, what the data collection team does, and what your role is.", "min": 7, "body": "\n<p>If a participant asks you who Centific is, this is all you need:</p>\n<div class=\"script\">Centific is a global data and AI company. We collect real-world video and behavior so that AI systems learn to recognize the world as it actually looks — not just textbook examples. Tonight's captures become part of the training material that teaches those systems what they are looking at in the dark.</div>\n<p>Everything below is context so you can answer follow-up questions with confidence. You are not expected to recite it.</p>\n<div class=\"video-embed\"><div class=\"video-fallback\">&#9654; Moderator Fundamentals — Centific Branding<br><a href=\"https://digitaltechedge.sharepoint.com/:v:/r/sites/Project_Twilight_Moderators/Shared%20Documents/Moderator%20Training%20Materials/Moderator%20Fundamentals%20-%20Centific%20Branding.mp4?d=w5aac1b86efe64ffa895759324e8b7717&csf=1&web=1&e=xihNec\" target=\"_blank\" rel=\"noopener\">Watch on the Moderator SharePoint &#8599;</a><br><span style=\"font-size:11.5px;\">Sign in with your Centific credentials.</span></div></div>\n\n<h2>1. Who is Centific?</h2>\n<p>Centific is a global data and AI solutions company. We do not build the AI products you would recognize by name. We build the data those products learn from — which is why Centific is sometimes described as the hidden infrastructure behind AI models.</p>\n<p>Our clients are companies that build AI systems. They come to us because a model is only as good as the data it learned from, and good data does not exist by default. Someone has to go out and create it, carefully, with real people. That is our job.</p>\n<p>What we provide to those clients:</p>\n<ul>\n<li><strong>Data creation and collection.</strong> Speech, conversation, video, images, sensor data, and text are all types of data we collect. These are gathered in structured sessions like the ones you will run.</li>\n<li><strong>Human judgment and evaluation.</strong> Experts review, rate, correct, and label AI output so systems learn what a good answer looks like and where they get things wrong.</li>\n<li><strong>Language and cultural coverage.</strong> Data work in 350+ languages and regional variants, so AI works for people outside a handful of major markets.</li>\n<li><strong>Platforms and tooling.</strong> The systems that manage all the above at scale, including the tools you will use to run and submit sessions.</li>\n</ul>\n<p>The scale behind that: a network of over 1.8 million domain experts, working across 230+ markets and 50+ industries.</p>\n<p>Centific's mission line is <em>\"The Future Learns Here.\"</em> That is literal. The data collected in your sessions is what the technology learns from.</p>\n<div class=\"callout\"><div class=\"c-ic\">&#9432;</div><div class=\"c-tx\"><strong>One rule that never changes:</strong> we never disclose which client a project is for. Not to participants, not to friends, not on social media. That confidentiality is part of the agreement Centific has with every client, and it is part of your agreement with Centific.</div></div>\n\n<h2>2. What does the data collection team do?</h2>\n<p>The data collection team is the part of Centific that turns a client requirement into a finished, usable dataset. A client says, in effect, \"our system fails to have natural conversation in this language.\" The data collection team designs and runs the work that fixes it.</p>\n<p>End to end, that looks like:</p>\n<ol>\n<li><strong>Define the spec.</strong> What kind of footage or behavior is needed, from which kinds of people, in what conditions, and what counts as acceptable quality.</li>\n<li><strong>Recruit and consent participants.</strong> Find people who match the profile, explain what they are agreeing to, and collect proper consent before anything is recorded.</li>\n<li><strong>Schedule and prepare.</strong> Match participants to sessions and moderators, confirm attendance, and make sure the tooling works before anyone joins.</li>\n<li><strong>Run the sessions.</strong> This is where you come in. Moderators run the actual recordings to the project format.</li>\n<li><strong>QA review.</strong> Every recording is checked against the project quality standards. Sessions that miss the bar are flagged, returned, or rejected.</li>\n<li><strong>Process and deliver.</strong> Accepted sessions are transcribed, labeled, packaged into a dataset, and delivered to the client to train and evaluate their system.</li>\n</ol>\n<p>Two things worth understanding about how the team works:</p>\n<ul>\n<li><strong>Quality is the product, not volume.</strong> A large pile of unusable recordings is worth nothing. The team is measured on how much data passes QA, not on how much was recorded.</li>\n<li><strong>Every stage depends on the one before it.</strong> A rejected session does not just cost one recording; it costs the participants' time, the recruiter's effort, and leaves a gap in the dataset that someone must fill again.</li>\n</ul>\n<p>As a Data Collection Moderator, you will mainly interact with your Project Manager (scheduling, questions, escalations) and, indirectly, with QA reviewers, whose feedback tells you whether your sessions are hitting the standard. Names and contact details for your specific project are covered in the point-of-contact module.</p>\n\n<h2>3. What is the Moderator role?</h2>\n<p>You are the person who runs the session and is responsible for the video data being usable. Every other stage of the pipeline is either preparing for your session or reacting to what you produced. You are also the person that functions as a calm, confident coach for the participant. You guide and show them how to act, speak, or interact so you can collect the data accurately.</p>\n<p>What the role involves:</p>\n<ul>\n<li><strong>Prepare.</strong> Check your equipment, environment, and the recording tool before the session starts — not while participants are waiting.</li>\n<li><strong>Set people at ease.</strong> Welcome participants, explain what is going to happen, and confirm they understand what they consented to. Nervous participants produce stiff, unnatural behavior, which is exactly what the dataset does not need.</li>\n<li><strong>Hold the format.</strong> Keep the session inside the project specifications: the right structure, the right language behavior, and the right duration. A moderator coaches and works with the participant so they don't feel the session is like a test.</li>\n<li><strong>Keep the action natural.</strong> Step in when a scenario stalls, and step back when it is running well. Communicate enough to capture the required data effectively.</li>\n<li><strong>Handle problems live.</strong> Noise, dropouts, a participant who goes off-format or uncomfortable — moderators deal with the situation in the moment and note it.</li>\n<li><strong>Submit correctly and flag issues.</strong> Follow the submission steps exactly, and tell your Project Manager about anything that went wrong. An honest flag is far cheaper than a surprise found in QA.</li>\n</ul>\n<p>Just as important, what the role is not:</p>\n<ul>\n<li><strong>You are not an interviewer or researcher.</strong> You are not there to collect opinions, test a product, or get to the truth of anything. The conversation or the acted scenario itself is the deliverable.</li>\n<li><strong>You are not the QA reviewer.</strong> You apply first-line quality judgment, but you do not decide whether a session is accepted. Flag it and let QA decide.</li>\n<li><strong>You are not the client's representative.</strong> You represent Centific. You cannot speak for the client, and you cannot name them.</li>\n<li><strong>You are not expected to improvise policy.</strong> If a participant asks something you were not briefed on, it is completely acceptable to route them to the centralized project email address. Centific's delivery team monitors this email account and addresses participant questions there.</li>\n</ul>\n<div class=\"callout\"><div class=\"c-ic\">&#9733;</div><div class=\"c-tx\"><strong>The core of the job:</strong> be warm enough that people forget they are being recorded, while quietly holding them to a technical spec. These are two sides of the same coin, and getting the balance right is the whole skill.</div></div>\n<p>You are also, for most participants, the only person from Centific they will ever meet. To them, you are the company. How you handle the session shapes whether they trust the process, whether they come back, and whether they tell other people this was a good experience.</p>\n\n<h2>Why we collect data — the honest answer</h2>\n<p>AI systems learn from examples. If the examples are narrow, the system is narrow. A vision system trained mostly on bright, tidy, well-lit daytime footage will do fine in a lab and then fail the moment it meets a real property after dark — a driveway lit by a single bulb, someone in dark clothing, a car moving behind a hedge, headlights washing across a wall, rain sitting on the lens.</p>\n<p>That failure is not an abstraction. It means a system that cannot tell a person from a shadow, that misses movement it should have caught, or that raises an alert for a branch moving in the wind — because scenes like that were not in the training data. It is the difference between technology people trust after dark and technology they switch off.</p>\n<div class=\"callout\"><div class=\"c-ic\">&#9679;</div><div class=\"c-tx\">Real night-time footage is genuinely hard to obtain. It cannot be scraped, and it cannot be convincingly simulated — darkness, artificial light, infrared, weather and motion all behave in ways a rendered scene gets subtly wrong. It has to be captured, with consent, at real properties, by people who agree to take part. That is why these sessions exist, and it is why the precision of your captures matters: the value is in exactly what moved, exactly where, and exactly how far away.</div></div>\n\n<h2>Saying it to a participant</h2>\n<p>Keep it short, plain, and honest. Something like:</p>\n<div class=\"script\">\"I work with Centific — we're a company that collects data used to train AI systems. Tonight we're recording video around your home after dark. The reason is that this kind of technology has to work in real conditions, and real night-time footage is genuinely hard to come by.\"</div>\n<div class=\"script\">\"The footage gets reviewed for quality and then goes into a dataset used to train that technology. You agreed to that in the consent form you signed, and you can stop or ask me anything at any point.\"</div>\n\n<h2>What not to say</h2>\n<ul>\n<li><strong>Never name the client.</strong> If asked which company the data is for, say plainly: \"I'm not able to share the client's name — that's part of our agreement with them. What I can tell you is what the data is used for.\" That is a complete, professional answer. Do not hint, do not guess, do not confirm a participant's guess.</li>\n<li><strong>Do not speculate.</strong> If you do not know how the data will be used beyond what you have been told, say so and offer to check with your point of contact.</li>\n<li><strong>Do not make promises</strong> about payment amounts, timelines, retention periods, or future work that are not in the project documentation you were given.</li>\n<li><strong>Do not oversell.</strong> \"You're helping build AI that understands people like you\" is true. \"Your footage will be in a famous product\" is not something you can promise.</li>\n</ul>\n\n<h2>Questions participants actually ask</h2>\n<ul>\n<li><strong>\"Who is this for?\"</strong> — Centific collects data on behalf of companies that build AI systems. You cannot name the client, and you can say that openly.</li>\n<li><strong>\"Will my house or my face be identifiable?\"</strong> — Be straightforward about what is in frame. The intended fields of view are the backyard, the driveway, and the front yard, so their property does appear. They appear only minimally, since the cameras are pointed at the space rather than at them. Beyond that, how the footage is handled, stored, and who can see it is set out in the consent form they signed, and ben_prod_twilight@centific.com answers anything the form does not. Do not speculate about de-identification or blurring.</li>\n<li><strong>\"What happens to my recording?\"</strong> — It is reviewed for quality, processed, and used as AI training data under the terms in the consent form. Handling and storage follow the project's data protection rules.</li>\n<li><strong>\"Am I doing it right?\"</strong> — Reassure them: there is no wrong way to do this. Just be yourself. This is usually the most useful thing you can say all session.</li>\n</ul>\n\n<h2>Why this matters for you</h2>\n<p>Participants relax when the person running the session sounds like they know what they are doing and why. A moderator who can explain the purpose in two clear sentences gets a more natural session — which is exactly what a Centific project is trying to capture. Confidence about the \"why\" is a quality tool, not just a courtesy.</p>\n", "gate": "quiz"}, {"id": "fundamentals", "ic": "&#127777;", "title": "Moderator Fundamentals", "sub": "What Twilight is, the doorstep handshake, what the role is not, and who to contact.", "min": 8, "body": "\n<h2>What Twilight is</h2>\n<p>Twilight is a nighttime video data capture project. You will drive to a participant's property after dark, set up a camera kit covering the backyard, the driveway and the front yard, run a set of captures to a fixed specification, pack down, and leave. Every session is at night.</p>\n<div class=\"callout\"><div class=\"c-ic\">&#9679;</div><div class=\"c-tx\"><strong>The captures happen outdoors.</strong> You will go inside briefly to reach the Wi-Fi modem, and that is the only reason you go inside. Nothing is captured indoors. Say this to participants unprompted — it is the single most reassuring thing you can tell someone who has just let a stranger with cameras into their house.</div></div>\n<p><strong>Participants run most of the scenarios themselves.</strong> Their appearance on camera is minimal, but it is not zero. You are there to make sure the capture is usable — the right framing, the right conditions, the right take — not to perform the scenario for them. Briefing clearly, and being willing to ask for a take again, is most of the job.</p>\n<p>Three facts shape almost everything else in this course: you are working after dark, you are working outside in view of the street and the neighbors, and the person whose property you are on is also the person running the scenario.</p>\n<p>You are the person who runs the session and is responsible for the captured data being usable. Every other stage of the pipeline is either preparing for your session or reacting to what you produced.</p>\n\n<h2>The doorstep handshake</h2>\n<p>You cannot rely on a Teams window to signal that you are the expected professional. Signal it the way the format allows:</p>\n<ul>\n<li>Wear your Centific-branded shirt. It is the fastest visual answer to \"who are you and why are you on my street.\"</li>\n<li>Wear your Centific ID badge on a lanyard, visible, for the entire visit — not in your pocket.</li>\n<li>Arrive within the window you gave them. You told them an ETA while you were en route; hold to it.</li>\n<li>Introduce yourself by your real first name at the door, before anything else.</li>\n</ul>\n<div class=\"script\">\"Hi, I'm [name]. I'm here from Centific for tonight's data capture session — we spoke earlier about the timing.\"</div>\n<div class=\"callout\"><div class=\"c-ic\">&#9432;</div><div class=\"c-tx\"><strong>\"From Centific,\" or \"on behalf of Centific,\" is the right phrasing and it matters.</strong> You work with Centific, not for Centific. Your agency is your employer. the Hours and Pay module covers why that distinction protects you.</div></div>\n<ul>\n<li>Confirm you are at the right address and speaking to the booked participant before you unload any equipment.</li>\n<li>Ask before you go inside, every time, even if you were inside twenty minutes ago. \"Do you mind if I step in to check the modem?\" costs nothing and it keeps the boundary clear.</li>\n<li>Inside the property, go to the modem and come back. Do not wander, do not open anything, do not photograph anything indoors.</li>\n</ul>\n<div class=\"callout\"><div class=\"c-ic\">&#9432;</div><div class=\"c-tx\"><strong>Twilight uses real names. There are no aliases.</strong> The participant's name is on your booking and you are expected to greet them by it. Being greeted by name is a large part of what makes two strangers at a door after dark feel expected rather than alarming.<br><br><strong>The name never enters a capture.</strong> Do not say it once a camera is rolling, and do not let it appear on anything in shot. If you need to refer to the participant mid-capture, say \"the participant.\"</div></div>\n\n<h2>What the role is not</h2>\n<ul>\n<li>You are not the client's representative. You represent Centific, you cannot speak for the client, and you cannot name them.</li>\n<li>You are not the QA reviewer. You apply first-line judgment, then flag. You do not decide whether a capture is accepted.</li>\n<li>You are not expected to improvise policy. If you are asked something you were not briefed on, routing it is the correct, professional answer — not a failure.</li>\n<li><strong>You are not security, and you are not a spokesperson to the public.</strong> If a neighbor or an officer approaches, your job is to stay calm, present the documents you carry, and notify your PC. It is not to win the conversation. The Nighttime Filming, Difficult Situations and Safety module covers this in full.</li>\n</ul>\n\n<h2>Who to contact</h2>\n<h3>How to reach the team during a night session</h3>\n<p>Work down this order. Only escalate to the next level if the previous one is not reachable.</p>\n<table class=\"tbl\">\n<tr><th>Step</th><th>How</th><th>When</th></tr>\n<tr><td><strong>1 &mdash; Active PC</strong></td><td>Call or text the Project Coordinator supporting tonight's shift (Sree or Annie).</td><td>First contact for any issue arising during the session.</td></tr>\n<tr><td><strong>2 &mdash; Teams channel</strong></td><td>Post in <strong>[EXT] Twilight Moderators</strong>. The whole team can see it and whoever is on will respond.</td><td>If the active PC is not reachable within a reasonable time.</td></tr>\n<tr><td><strong>3 &mdash; Email</strong></td><td>ben_prod_twilight@centific.com</td><td>If Teams has not produced a response. Lower priority than the two above for urgent matters.</td></tr>\n<tr><td><strong>4 &mdash; Individual contacts</strong></td><td>Contact Ritu, Sander, or another named team member directly.</td><td>Only if there is no response through any of the above three methods.</td></tr>\n</table>\n<div class=\"callout\"><div class=\"c-ic\">&#9888;</div><div class=\"c-tx\">\n<strong>Escalate directly to Ritu for two situations, skipping the order above:</strong>\n<ul><li>Law enforcement arrives at the property.</li>\n<li>The moderator team needs to leave the site for safety reasons.</li></ul>\nUse Teams or her direct email immediately. Do not wait for the PC channel first.</div></div>\n<p><strong>Contact order summary:</strong> Active PC &rsaquo; [EXT] Twilight Moderators &rsaquo; ben_prod_twilight@centific.com &rsaquo; Ritu (directly for law enforcement or safety only)</p>\n<h3>Named contacts</h3>\n<p>For non-urgent matters, or when you know exactly who to reach:</p>\n<table class=\"tbl\">\n<tr><th>If you need...</th><th>Contact</th><th>Role</th><th>Email</th></tr>\n<tr><td>Anything about Twilight: process, scheduling, sessions</td><td>Ritu Gupta</td><td>Sr. Project Manager</td><td>ritunarendrakumar.g@centific.com</td></tr>\n<tr><td>On-the-ground quality and operations</td><td>Sander Denecker</td><td>Program Manager</td><td>sander.denecker@centific.com</td></tr>\n<tr><td>Tooling: Ring and Lakitu</td><td>Brian Leong</td><td>Technical Program Manager</td><td>brian.leong@centific.com</td></tr>\n<tr><td>The Twilight App</td><td>David Kang</td><td>Technical Program Manager</td><td>david.kang@centific.com</td></tr>\n<tr><td>Day-to-day coordination and general queries</td><td>Annie Tran</td><td>Project Coordinator</td><td>thaingan.tran@centific.com</td></tr>\n<tr><td>Night-shift support while you are working</td><td>Sree Avula</td><td>Project Coordinator</td><td>sree.avula@centific.com</td></tr>\n<tr><td>Onboarding: this app, your progress, certification</td><td>Ingrid Lindstrom</td><td>Training &amp; Development</td><td>ingrid.lindstrom@centific.com</td></tr>\n<tr><td>Anything general, or you are not sure who to ask</td><td>The project team</td><td>—</td><td>ben_prod_twilight@centific.com</td></tr>\n<tr><td>Your pay, rate, bonuses, future work</td><td>Your agency</td><td>—</td><td>Centific cannot answer these. See the Hours and Pay module.</td></tr>\n</table>\n\n<h3>Where you send participants</h3>\n<table class=\"tbl\">\n<tr><th>Participant asks about...</th><th>Send them to</th></tr>\n<tr><td>The consent form they signed</td><td>ben_prod_twilight@centific.com</td></tr>\n<tr><td>How their data will be used, or who sees it</td><td>ben_prod_twilight@centific.com</td></tr>\n<tr><td>Withdrawing consent or deleting recordings</td><td>ben_prod_twilight@centific.com</td></tr>\n<tr><td>Anything about the session, scheduling, or rebooking</td><td>ben_prod_twilight@centific.com</td></tr>\n</table>\n<p><strong>You route these. You do not answer them.</strong> That is not a brush-off. It is how participants get an accurate answer instead of your best guess.</p>\n<p><strong>Read the address back when you give it to a participant.</strong> It takes a moment and it is what makes sure they reach the monitored account rather than emailing you directly.</p>\n\n<h2>Escalation</h2>\n<h3>Urgent, during a night session</h3>\n<p>Work down this order. Active PC &rarr; [EXT] Twilight Moderators &rarr; ben_prod_twilight@centific.com &rarr; Individual contacts. <strong>Exception:</strong> law enforcement or safety evacuation &rarr; contact Ritu directly and immediately.</p>\n<p><strong>While you are on site, use the Teams channel, not email.</strong> The channel is <strong>[EXT] Twilight Moderators</strong>. The team watches it through the night; email will not be seen in time. Your Project Manager adds you before your first session — if you have not been added by then, say so.</p>\n<table class=\"tbl\">\n<tr><th>Tier</th><th>What it covers</th></tr>\n<tr><td>Handle it yourself</td><td>Routine session flow, everything the scripts cover, normal setup problems you can resolve.</td></tr>\n<tr><td>Flag in real time</td><td>Anything you cannot resolve safely on your own while it is happening: a neighbor confrontation, police arriving, an unworkable environment, a participant who appears intoxicated, inappropriate conduct toward you, a participant in visible distress.</td></tr>\n<tr><td>Report afterward</td><td>Resolved, but leadership must know: a canceled or cut-short session, a withdrawal request, any complaint from a participant or a neighbor, equipment damage. Same night.</td></tr>\n<tr><td>Escalate immediately</td><td>Legal, privacy, or safety weight: a lost or corrupted capture, a demand touching the consent form you cannot answer, an allegation of misconduct, harm or threat of harm. Contact Ritu directly.</td></tr>\n<tr><td>Escalate directly to Ritu (skip the order)</td><td>Law enforcement arrives at the property, OR the team needs to leave for safety reasons. Do not wait for the PC or Teams first.</td></tr>\n</table>\n", "gate": "quiz"}, {"id": "workflow", "ic": "&#128203;", "title": "Project Workflow", "sub": "The shape of a Twilight night, covered hands-on at in-person training.", "min": 5, "body": "\n<p>You will receive hands-on training on the end-to-end Twilight session workflow during in-person training. This module gives you the shape of a night so you arrive with the sequence already in your head. The in-person training will cover:</p>\n<ul><li>Receiving and reviewing your session assignment</li><li>Pre-session contact with the participant</li><li>Travel and the call while en route</li><li>Arrival, introductions, and access to the Wi-Fi modem</li><li>Setup and equipment placement</li><li>Calibration</li><li>Capturing the required scenarios</li><li>Pack-down and departure</li><li>Session close-out and submission</li></ul>\n<h2>The one thing that is already settled</h2>\n<div class=\"callout\"><div class=\"c-ic\">&#9432;</div><div class=\"c-tx\"><strong>The Twilight App is your source of truth in the field.</strong> Not your phone notes, not a text from your PC, not memory. Where you are going, the SOP, troubleshooting steps and the scenario list all live in that one app, so you are not juggling tabs in the dark.</div></div>\n<p>Twilight does not use session logs. Whatever record is required is captured in the Twilight App, so there is no separate write-up at the end of the night.</p>\n", "gate": "none"}, {"id": "guidelines", "ic": "&#128196;", "title": "Client Guidelines, Moderator-Facing", "sub": "The Project Twilight SOP, covered during in-person training.", "min": 6, "body": "\n<p>During on-site training, you will proceed to read and understand the Project Twilight SOP (Standard Operating Procedure), which governs the night-time outdoor video collection process. This SOP will equip moderators with step-by-step guidance on location scouting, recording scenarios, and capturing high-quality video at residential sites under low-light and dark conditions.</p>\n<p>Data collected under this SOP feeds machine-learning pipelines; footage quality directly impacts model performance.</p>\n<div class=\"callout\"><div class=\"c-ic\">&#9888;</div><div class=\"c-tx\"><strong>Calibration errors, poor camera placement, incorrect lighting setup, and incorrect scenario execution result in unusable data.</strong> Follow every step carefully when engaging with the SOP.</div></div>\n<h2>Where to find the SOP</h2>\n<p>The SOP is located on the <a href=\"https://digitaltechedge.sharepoint.com/sites/Project_Twilight_Moderators\" target=\"_blank\" rel=\"noopener\">Project Twilight Moderators SharePoint</a>. Read it as soon as you have access and keep using it — it is the reference you work from throughout the project, not something you read once at training and put away.</p>\n", "gate": "none"}, {"id": "hardware", "ic": "&#128268;", "title": "Device Handling and Hardware Setup", "sub": "What in-person training covers, and the one thing to know before you get there.", "min": 8, "body": "\n<p>You will receive hands-on training on the equipment used for Twilight, and learn how to calibrate the settings for accurate data capture, at in-person training. This module does not replace that day. It tells you what the day covers, so you arrive knowing the shape of it rather than meeting the kit cold.</p>\n\n<h2>What in-person training covers</h2>\n<ul>\n<li>Preparing, transporting, and protecting project hardware</li>\n<li>Completing a Collection Equipment Checklist</li>\n<li>Pre-installation: location scouting, network, and equipment setup</li>\n<li>Camera and device positioning</li>\n<li>Installation: rig assembly and station setup</li>\n<li>Calibration</li>\n<li>Controlling floodlight and spotlight lighting</li>\n<li>Capturing the required scenarios</li>\n<li>Additional metadata and project-specific app settings</li>\n<li>Safety protocol</li>\n<li>UI and software flow</li>\n<li>Troubleshooting tips</li>\n</ul>\n<p>Everyone trains on this equipment from scratch, including moderators who have worked on other data collection projects. The Twilight configuration is specific to this project.</p>\n\n<h2>The one thing to know before you get there</h2>\n<div class=\"callout\"><div class=\"c-ic\">&#9733;</div><div class=\"c-tx\"><strong>Calibration is the highest-stakes step of the night.</strong> If the calibration capture is wrong, the entire session is unusable &mdash; not the one capture, the whole night. The participant's time, the drive, the setup and every scenario filmed after it are all wasted. When unsure, redo it. A redone calibration costs ten minutes. A bad one costs the session.</div></div>\n<p>You are not expected to arrive knowing how to do this. You are expected to arrive knowing that it matters.</p>\n", "gate": "quiz"}, {"id": "tools", "ic": "&#128241;", "title": "Ring and Lakitu", "sub": "Both capture applications, covered hands-on at in-person training.", "min": 6, "body": "\n<p>You will receive hands-on training on both applications used for Twilight, and learn how to operate them during a live capture, at in-person training. The in-person training will cover:</p>\n<ul><li>Logging in and confirming your profile</li><li>Finding your session assignment for the night</li><li>Running a capture in the Ring app</li><li>Recording, uploading and reviewing in the Lakitu web app</li><li>Additional metadata and project-specific app settings</li><li>What to do when an app will not load or a session will not appear</li></ul>\n<p>Everyone trains on both applications, including moderators who have used them on other projects. The Twilight configuration is specific to this project.</p>\n<div class=\"callout\"><div class=\"c-ic\">&#127909;</div><div class=\"c-tx\"><strong>A demo is being filmed on site.</strong> An experienced moderator will record a walkthrough of both applications during collection, and it will be posted to the Moderator SharePoint. Look for it there rather than expecting it in this module.</div></div>\n<div class=\"callout\"><div class=\"c-ic\">&#9432;</div><div class=\"c-tx\"><strong>One rule that is already settled.</strong> Playback works in the Ring app, and a participant may see you use it. Never tell a participant you are unable to play a capture back — the approved wording for both apps is in the Participant Communication module.</div></div>\n", "gate": "none"}, {"id": "troubleshooting", "ic": "&#128295;", "title": "Hardware Troubleshooting", "sub": "Recovering when the kit misbehaves, covered at in-person training.", "min": 5, "body": "\n<p>You will receive hands-on training on troubleshooting the Twilight equipment and applications during in-person training. The in-person training will cover:</p>\n<ul><li>A camera that will not power on or will not connect</li><li>Wi-Fi and network problems at the property</li><li>App-side faults in the Ring and Lakitu applications</li><li>Recovering a capture that failed partway through</li><li>When to stop troubleshooting and escalate</li></ul>\n<h2>Two principles that are already settled</h2>\n<p><strong>You are not expected to repair client hardware.</strong> Work the steps you are given. If it is not resolved at the end of them, that is the correct time to escalate, and escalating is not a failure.</p>\n<p><strong>A delayed session costs less than a bad one.</strong> If you cannot get the equipment into a state where the capture will pass, do not film anyway and hope. Stop, notify your PC, and let the session be rebooked.</p>\n<p>Deliberately kept separate from the equipment module. Setting the kit up correctly and recovering when it misbehaves are different skills.</p>\n", "gate": "none"}, {"id": "comms", "ic": "&#128172;", "title": "Participant Communication", "sub": "The contact cadence, setting expectations, and nine on-site scripts.", "min": 18, "body": "\n<h2>The contact cadence</h2>\n<p>A participant hears from Centific four times before you arrive. Knowing where you sit in that sequence stops you repeating what they already have, or assuming they have what they do not.</p>\n<table class=\"tbl\">\n<tr><th>#</th><th>Who</th><th>What</th></tr>\n<tr><td>1</td><td>Scheduling team</td><td>Reaches out to check availability and agree a night.</td></tr>\n<tr><td>2</td><td>Automated</td><td>Booking confirmation email, sent to the participant and to you.</td></tr>\n<tr><td>3</td><td>You</td><td>A message before the session confirming you are coming and when.</td></tr>\n<tr><td>4</td><td>You</td><td>A phone call while you are en route.</td></tr>\n</table>\n\n<h2>The call while en route</h2>\n<div class=\"callout\"><div class=\"c-ic\">&#9888;</div><div class=\"c-tx\"><strong>Do not arrive unannounced.</strong> Always call the participant before you get there. This is not optional and it is not covered by the booking email.</div></div>\n<p>Four things to confirm on that call:</p>\n<ul>\n<li>The participant is home.</li>\n<li>The participant is ready.</li>\n<li>Your estimated time of arrival.</li>\n<li>That they have no questions before you turn up on the drive.</li>\n</ul>\n<div class=\"script\">\"Hi, this is [name] from the Twilight Project from Centific. I'm on my way and should arrive in about [X] minutes. I wanted to confirm you're home and ready for today's session.\"</div>\n<div class=\"callout\"><div class=\"c-ic\">&#9432;</div><div class=\"c-tx\"><strong>You use your own phone.</strong> Call the participant from your personal number before the session, and text that same number at the end of the collection. There is no project phone line.<br><br><strong>Once the session is fully complete, you stop being the contact.</strong> If a participant calls or texts you after that, route them to ben_prod_twilight@centific.com rather than answering yourself.</div></div>\n\n<h2>Arrival</h2>\n<p>Open with a friendly, professional, respectful greeting. You are two strangers arriving at a private home after dark, and the first fifteen seconds set the tone for everything after them.</p>\n<div class=\"script\">\"Thank you for participating in the Twilight Project. We appreciate your time and support.\"</div>\n\n<h3>Explain the session</h3>\n<p>Say plainly what is about to happen, before anything comes out of the vehicle.</p>\n<div class=\"script\">\"We will be setting up equipment and recording scenarios in the backyard and driveway. However, we need to connect to your Wi-Fi modem, so we will need to access that. We may occasionally ask for your assistance during the session.\"</div>\n<p>Then, before anything is unloaded, ask to look at the space. You need to confirm the driveway and backyard meet the client requirements before you start setting up — finding out afterward costs the session.</p>\n<div class=\"script\">\"We'd like to scope out the driveway and backyard to ensure those location requirements are met.\"</div>\n\n<h3>Wi-Fi access</h3>\n<p>Ask, do not assume. This is the one time you go inside, and it should feel like a request rather than a step in your process.</p>\n<div class=\"script\">\"Would you mind showing us where the Wi-Fi modem is located?\"</div>\n<p>Respect the participant's privacy and personal space when accessing or working around the modem. Go to it, do what you need, and come back out.</p>\n\n<h2>Setting expectations at the door</h2>\n<p>Before you set anything up, walk the participant through the shape of the evening so nothing comes as a surprise. At minimum, cover the estimated setup time, the estimated session duration, when you may need their help, and anything else they should know before you begin.</p>\n<ul>\n<li>How long you expect to be in their home.</li>\n<li>Where you will need to place equipment, and that you will ask before moving anything of theirs.</li>\n<li>That the lighting will be bright at times, and roughly when.</li>\n<li>That you may need to redo a capture, that this is completely normal, and that it is never a comment on them.</li>\n<li>That they will be running most of the scenarios themselves, and that you will brief them on each one before it starts.</li>\n<li>That their own appearance on camera is minimal, and that nothing is filmed indoors.</li>\n<li>That they can stop, pause, or ask you anything at any point.</li>\n</ul>\n<div class=\"callout\"><div class=\"c-ic\">&#9432;</div><div class=\"c-tx\"><strong>Session duration, the number of captures and takes, and what the participant is asked to do are covered in the Project Workflow module and at in-person training.</strong> Give the participant the specifics from there rather than estimating.</div></div>\n\n<h3>What the participant leaves with</h3>\n<p>By the time you pack down, every participant should know:</p>\n<ul>\n<li>That the captures were completed and submitted successfully.</li>\n<li>When and how they will be paid.</li>\n<li>Who to contact afterward, and that it is not you.</li>\n<li>That they will not receive or review copies of the footage.</li>\n</ul>\n<p>Thank them explicitly at the close. They let a stranger into their home at night and rearranged their evening around it.</p>\n\n<h2>During the session</h2>\n<p>Maintain a professional, courteous, and respectful attitude for the whole visit &mdash; including the parts where you think nobody is watching.</p>\n<table class=\"tbl\">\n<tr><th>Do</th><th>Don't</th></tr>\n<tr><td>Be professional and courteous</td><td>Enter areas without permission</td></tr>\n<tr><td>Treat the participant's home with respect</td><td>Move personal belongings</td></tr>\n<tr><td>Keep the participant informed</td><td>Discuss project issues or client concerns</td></tr>\n<tr><td>Ask permission before moving anything</td><td>Leave equipment or materials behind</td></tr>\n<tr><td>Thank participants when they assist</td><td></td></tr>\n</table>\n<div class=\"callout\"><div class=\"c-ic\">&#9432;</div><div class=\"c-tx\"><strong>When in doubt, ask for permission.</strong> The participant's home is their personal space. Respect, clear communication, and care for their property come before convenience or speed.</div></div>\n\n<h2>Before you leave</h2>\n<p>Run this check on every property, every time, before you get back in the vehicle:</p>\n<ul>\n<li>All equipment has been packed.</li>\n<li>No cables or supplies have been left behind.</li>\n<li>Recording areas have been restored to their original condition.</li>\n<li>No damage to participant property.</li>\n<li>Participant questions have been addressed.</li>\n<li>The participant has been thanked for their time and support.</li>\n</ul>\n<p>End on a positive, professional note.</p>\n<div class=\"callout\"><div class=\"c-ic\">&#128241;</div><div class=\"c-tx\"><strong>Text, do not knock.</strong> Collection can finish very late — past 2 or 3am. Once you are packed up and leaving, send the participant a text rather than going back to the door. If they have gone to bed, a knock wakes the household.</div></div>\n<p>Send it from the same number you called them from earlier. Every moderator uses the same message:</p>\n<div class=\"script\">\"Hi [name] — the Centific team has concluded our data collection for Project Twilight. Thank you very much for participating. If you have any follow-up questions, please email ben_prod_twilight@centific.com.\"</div>\n<p>If they are still up and you speak to them in person, thank them then as well — but send the text either way, so they have the contact address in writing.</p>\n\n<h2>Scripts</h2>\n<p>Watch this first. It shows these scenarios handled on a real session, including ones this module no longer scripts out in text.</p>\n<div class=\"video-embed\"><div class=\"video-fallback\">&#9654; Moderator Fundamentals — Participant Experience Scenarios<br><a href=\"https://digitaltechedge.sharepoint.com/:v:/r/sites/Project_Twilight_Moderators/Shared%20Documents/Moderator%20Training%20Materials/Moderator%20Fundamentals%20-%20PT%20Experience%20Scenarios.mp4?d=w99159a83a71f4c80909cda4774367ff9&csf=1&web=1&e=cVuDH7\" target=\"_blank\" rel=\"noopener\">Watch on the Moderator SharePoint &#8599;</a><br><span style=\"font-size:11.5px;\">Sign in with your Centific credentials.</span></div></div>\n\n<div class=\"script-card\"><h4>8.1 &middot; \"Who is this for?\"</h4>\n<div class=\"script\">\"Fair question, and I'm not able to name the company. How the footage gets used and who has access to it is all set out in the consent form you signed, so that's the best place to look. If you want more detail than what's in there, email ben_prod_twilight@centific.com and they'll answer it properly.\"</div>\n<div class=\"why\"><strong>Why.</strong> You do not need to restate the consent form and you do not need to explain what the client wants the data for. The participant already holds the document that answers this. Pointing to it is faster, and more accurate, than your paraphrase.</div>\n<div class=\"dont\"><strong>Don't:</strong> name or guess at the client &middot; confirm a participant's guess &middot; hint at the industry &middot; interpret the consent terms &middot; get flustered instead of routing cleanly.</div>\n</div>\n\n<div class=\"script-card\"><h4>8.2 &middot; Payment questions</h4>\n<p>Participants are paid through <strong>Tremendous</strong>. Rewards are delivered as a digital link where the participant selects their preferred payout method — a direct bank transfer, a local gift card, or a virtual Visa card.</p>\n<p><strong>Timing:</strong> payment is issued five business days after a <em>successfully completed</em> session.</p>\n<div class=\"callout\"><div class=\"c-ic\">&#9888;</div><div class=\"c-tx\">\n<strong>Payment depends on why the session ended.</strong>\n<ul>\n<li><strong>Participant chooses voluntarily to stop:</strong> no payment is issued.</li>\n<li><strong>Session stopped due to technical issues or external factors (not the participant's choice):</strong> the participant will still receive some payment.</li>\n</ul>\nYou do not determine the amount or communicate a figure. If the participant asks how much they will receive for the time filmed, route them to email ben_prod_twilight@centific.com with their payment question.</div></div>\n<div class=\"script\">\"You'll get a link from Tremendous about five business days after tonight's session, and you pick how you want to be paid from there — bank transfer, a gift card, or a virtual Visa. If it hasn't turned up after that, email ben_prod_twilight@centific.com and they'll sort it out.\"</div>\n<div class=\"script\">\"If you have any questions about the payment amount for tonight, please email ben_prod_twilight@centific.com and they'll be able to help you.\"</div>\n<div class=\"why\"><strong>Why.</strong> Full information about Tremendous was already given to the participant when they registered through OneForma, so you are confirming something they have seen rather than briefing them from scratch.</div>\n<div class=\"dont\"><strong>Don't:</strong> quote an amount or a partial amount — that is not yours to state &middot; promise a specific date &middot; offer to chase a payment personally &middot; tell a participant they will not be paid without routing them to the project inbox first.</div>\n<p>You are empowered to state the payment structure above and to route questions. You are not responsible for resolving payment disputes.</p>\n</div>\n\n<div class=\"script-card\"><h4>8.3 &middot; Technical problems and waiting</h4>\n<div class=\"script\">\"Sorry about the wait — that's on our end, not yours, and I appreciate your patience. Nothing you did caused this.\"</div>\n<div class=\"why\"><strong>Why.</strong> Setup and troubleshooting take visible time in someone's home, and silence while you work reads as something having gone wrong. Naming it before they ask keeps it ordinary.</div>\n<div class=\"dont\"><strong>Don't:</strong> get defensive &middot; offer any form of compensation to smooth it over &middot; let frustration into your tone &middot; push ahead when the setup is compromised.</div>\n</div>\n\n<div class=\"script-card\"><h4>8.4 &middot; A participant wants to stop</h4>\n<div class=\"script\">\"Absolutely. You can stop at any time and that's completely okay. No explanation needed.\"</div>\n<div class=\"why\"><strong>Why.</strong> Honor it immediately and without friction. Any hesitation reads as pressure. If they ask about payment, give them the routing address and do not guess at a number. Never use payment as an argument for staying.</div>\n<p><strong>If they do not raise payment, do not raise it either.</strong> Volunteering \"you'll be paid less if you stop\" to someone mid-decision is pressure, whatever the intent.</p>\n<p>Questions about withdrawing consent or deleting footage go to ben_prod_twilight@centific.com. Do not describe the process yourself.</p>\n</div>\n\n<div class=\"script-card\"><h4>8.5 &middot; \"Can I see the footage?\"</h4>\n<p>Two answers, because the two apps behave differently. <strong>Do not tell a participant you are unable to play anything back.</strong> In the Ring app you can, and a participant who watches you work for long enough may see you do exactly that.</p>\n<p><strong>Ring app</strong></p>\n<div class=\"script\">\"We'd like to keep production moving along so we can capture all the takes we need for our collection.\"</div>\n<p><strong>Lakitu web app</strong></p>\n<div class=\"script\">\"The wait time for a recorded video to become available can be unpredictable, so we'd like to keep moving along with our next capture.\"</div>\n<div class=\"why\"><strong>Why.</strong> Both are true, and neither is a claim a participant can catch you out on. Playback in the Ring app is possible &mdash; but finding one specific video among the many you record takes real time, and you have a full set of captures to get through. Firm but polite is the tone: it is not necessary for a participant to view a capture, however interested they are.</div>\n<div class=\"dont\"><strong>Don't:</strong> claim you cannot play anything back &middot; offer to show them \"just one\" &middot; go hunting through the library to satisfy curiosity &middot; get drawn into a discussion of how the footage looks.</div>\n<p>Questions about how the footage is stored, who can see it, or the consent terms still go to ben_prod_twilight@centific.com.</p>\n</div>\n\n<div class=\"script-card\"><h4>8.6 &middot; Someone walks into frame</h4>\n<p>The captures cover a backyard, a driveway and a front yard. The participant is in shot at times, by design. Nobody else should be — not another household member, not a visitor, not a dog walker, not a neighbor. None of them signed anything.</p>\n<div class=\"script\">\"Sorry — could I ask everyone else to stay clear of the driveway for the next few minutes? Only [participant] can be in these.\"</div>\n<p><strong>Before you start,</strong> ask who else is home, whether anyone is expected, and whether there are pets with access to the yard. Agree where everyone will be while you film. Doing this once at the start saves stopping repeatedly later.</p>\n<div class=\"why\"><strong>Why.</strong> Anyone on camera is a privacy failure, not a quality one, and it cannot be fixed afterward. Outdoors it will happen more often than anyone expects, so treat it as routine rather than as an incident — redo the capture, no drama, no apology needed from them.</div>\n<div class=\"dont\"><strong>Don't:</strong> push ahead hoping it will be fine &middot; let a passer-by remain in frame &middot; ask a neighbor to sign anything &middot; follow someone down the street to ask them to move.</div>\n<div class=\"callout\"><div class=\"c-ic\">&#9432;</div><div class=\"c-tx\"><strong>Neighboring property in shot is expected and approved.</strong> The Twilight cameras are wide-angle, so captures will include parts of neighboring homes, parked cars and the street. This was raised with the client early on and they confirmed they were happy to proceed. No additional NDA or consent forms are needed to cover it.<br><br>That is about the edges of the frame, not the people in it. Someone who is not on the consent form still should not be in a capture.</div></div>\n</div>\n\n<h2>Session debrief: what you may tell them afterward</h2>\n<div class=\"callout\"><div class=\"c-ic\">&#9432;</div><div class=\"c-tx\"><strong>There is no session debrief on Twilight.</strong> You do not tell a participant whether their session passed, what happens to the footage next, or whether they may be contacted again — you will not know, and it is not yours to say.</div></div>\n<p>What you can confirm before you leave is what is already in this module: that the captures were completed and submitted, when and how they will be paid, and who to contact afterward. Anything past that goes to ben_prod_twilight@centific.com.</p>\n<p>Say it plainly rather than deflecting. \"That gets reviewed by a different team, so I won't see the outcome\" is an honest, complete answer and it closes the conversation without sounding evasive.</p>\n\n<h2>Two PII rules, and they are absolute</h2>\n<p>Twilight uses real names, so the participant's name is on your booking and you will say it at the door. That makes the limits on it more important, not less.</p>\n<ul>\n<li><strong>Never spoken while a camera is rolling.</strong> The name is not part of the data and must not end up in it. Between takes, say \"the participant.\"</li>\n<li><strong>Never written anywhere the booking does not already hold it.</strong> Not in task-app free text, not in a message, not in an escalation note. Use the session reference instead. Logs are retained and reviewable, so writing a name in order to correct it is what puts it permanently in the record.</li>\n</ul>\n", "gate": "quiz"}, {"id": "safety", "ic": "&#128737;", "title": "Nighttime Filming, Difficult Situations and Safety", "sub": "The Twilight night-time data collection safety protocol.", "min": 20, "body": "\n<div class=\"callout\"><div class=\"c-ic\">&#9733;</div><div class=\"c-tx\"><strong>This module is the Twilight Night-Time Data Collection Safety Protocol.</strong> It is not background reading. Everything in it applies on every session, and the incident scripts are the approved wording &mdash; use them as written rather than improvising.</div></div>\n\n<h2>Why the night changes things</h2>\n<p>On a daytime project, a camera crew at a house is unremarkable. At night it is not. Floodlights cycling on and off in a residential street will be noticed, and some of the people who notice will be trying to sleep. You are also working outdoors, in a driveway and a yard, under lights &mdash; visible from the street for the whole session in a way an indoor crew would not be.</p>\n<p>None of that is a reason for anxiety. It is a reason to have an answer ready before you need it.</p>\n\n<h2>Pre-collection</h2>\n<div class=\"callout\"><div class=\"c-ic\">&#9632;</div><div class=\"c-tx\" style=\"color:#1F3864;\">\n<strong>The session does not start until the printed consent forms are physically signed by the participant.</strong> \nHave the forms ready before you arrive. If the participant has not signed them when you get there, you cannot begin setup until they do. \nSigned forms also serve as your proof of authorization on site.</div></div>\n\n<h3>Your health and readiness</h3>\n<ul>\n<li>You must confirm, on the day, that you are fit to work a graveyard shift. This is a live check each session, not a one-time declaration.</li>\n<li>If your partner is not fit to work, report it to <strong>ben_prod_twilight@centific.com</strong>. Backup staff will be provided.</li>\n<li>Sessions are canceled in unsafe weather, extreme temperatures, or severe weather events. That call is not yours to make alone &mdash; raise it.</li>\n</ul>\n<div class=\"callout\"><div class=\"c-ic\">&#9432;</div><div class=\"c-tx\"><strong>Reporting an unfit partner is not informing on a colleague.</strong> There is a backup process precisely so that nobody has to choose between covering for someone and working a night shift alongside a person who should not be there.</div></div>\n\n<h3>Participant preparation</h3>\n<ul>\n<li>The participant must inform their neighbors about the collection activity in advance. That groundwork is laid before you arrive.</li>\n<li>You display the authorization banner at the collection site.</li>\n<li>The banner shows the company name, that the project is authorized by the homeowner, and that your presence is legitimate.</li>\n</ul>\n\n<h3>Materials to carry</h3>\n<table class=\"tbl\">\n<tr><th>Item</th><th>Why</th></tr>\n<tr><td>Printed consent forms, <strong>signed by the participant at the start of the session</strong></td><td>The session does not begin until these are physically signed. They are also your proof of authorization on site.</td></tr>\n<tr><td>Centific company identification</td><td>Proof of who you are</td></tr>\n<tr><td>Authorization banner / notice</td><td>Answers the question before it is asked</td></tr>\n<tr><td>Flashlights &mdash; required</td><td>Both of you carry one</td></tr>\n<tr><td>Walkie talkies &mdash; required</td><td>Pair communication when out of sight of each other</td></tr>\n</table>\n\n<h2>During collection</h2>\n\n<h3>General safety</h3>\n<ul>\n<li>Be aware of your surroundings at all times.</li>\n<li>Keep your flashlight accessible and use it near your feet to light the path ahead.</li>\n<li>Park in well-lit areas where possible.</li>\n<li>Start setup and calibration during dusk, before full dark, whenever feasible. Less time working in darkness is the simplest risk reduction available to you.</li>\n</ul>\n\n<h3>Pairing and communication</h3>\n<ul>\n<li>Always work in pairs.</li>\n<li>Maintain awareness of each other's location at all times.</li>\n<li>Use walkie talkies to check in when out of sight or moving between locations.</li>\n<li>Both moderators carry flashlights.</li>\n</ul>\n\n<h3>Flashlight use during lights-off scenarios</h3>\n<ul>\n<li>Flashlights are permitted for safety purposes. Your safety is not traded against a capture.</li>\n<li>Hold the flashlight naturally, near your feet, when walking.</li>\n<li>Never shine a flashlight directly at the cameras.</li>\n</ul>\n\n<h2>Incident response</h2>\n\n<div class=\"script-card\"><h4>9.1 &middot; Approached by a neighbor or passerby</h4>\n<p>Remain calm and professional. Identify yourself:</p>\n<div class=\"script\">\"Hi, we're capturing videos and images of activities as part of our work. We're authorized to use this space by the homeowner.\"</div>\n<p>Show the homeowner consent form. If they want further confirmation, have the homeowner confirm your authorization.</p>\n<p>Then reassure them:</p>\n<div class=\"script\">\"You are not in frame, and no video or data of yours is being captured.\"</div>\n<div class=\"why\"><strong>Why.</strong> A neighbor wants two things: to know this is legitimate, and to know it does not involve them. Answer both quickly and most conversations end there.</div>\n<div class=\"dont\"><strong>Don't:</strong> mention the Twilight App or the client name &middot; argue or escalate &middot; discuss what is being filmed &middot; give out your personal contact details.</div>\n<p><strong>You may say you are working for Centific.</strong> That is the extent of it.</p>\n<p><strong>Split the job.</strong> One of you talks; the other pauses the capture and stays with the kit.</p>\n<div class=\"callout\"><div class=\"c-ic\">&#9888;</div><div class=\"c-tx\"><strong>If they come onto the property, split differently.</strong> One moderator tells the participant that a neighbor has approached — even if it is late at night. The other points to the authorization banner and the participant's signed consent form.<br><br><strong>Do not show the NDA to a neighbor or a passerby.</strong> That document stays private. The banner and the signed consent form are what you show.</div></div>\n</div>\n\n<div class=\"script-card\"><h4>9.2 &middot; An aggressive or confrontational encounter</h4>\n<p>Do not engage.</p>\n<div class=\"script\">\"I understand your concern, let me get the homeowner for you.\"</div>\n<div class=\"callout\"><div class=\"c-ic\">&#9888;</div><div class=\"c-tx\"><strong>If you feel unsafe, stop collection immediately, pack up, and leave.</strong> You do not need permission and you do not need to finish first. Contact the project lead immediately. If there is an immediate safety threat, <strong>call 911</strong>.</div></div>\n<div class=\"why\"><strong>Why.</strong> Handing the conversation to the homeowner moves it to the one person on the street with standing to settle it, and takes you out of an argument you cannot win.</div>\n</div>\n\n<div class=\"script-card\"><h4>9.3 &middot; Law enforcement arrives</h4>\n<p>Be cooperative and polite. Say you are from Centific and provide full project details.</p>\n<div class=\"script\">\"We're conducting a camera project with the homeowner's explicit permission.\"</div>\n<p>Offer the homeowner as a point of contact for confirmation, and have the participant's contact information readily accessible.</p>\n<p><strong>Show:</strong> the consent forms, your company identification, and the authorization banner.</p>\n<div class=\"callout\"><div class=\"c-ic\">&#9432;</div><div class=\"c-tx\"><strong>Law enforcement is the exception on documents.</strong> With an officer you may share the NDA and the signed consent form, and point to the authorization banner. A neighbor sees the banner and the consent form only.<br><br><strong>If it still escalates, stop the collection immediately, pack up, and go.</strong></div></div>\n<p><strong>One of you speaks.</strong> Agree in the moment who that is &mdash; two people answering an officer at once reads badly and gets the details wrong. The other stops the capture and contacts the project lead.</p>\n<p>Comply with any instruction you are given. If you are asked to stop filming, stop filming. Nothing on this project is worth a dispute with an officer, and nobody at Centific will second-guess you for complying.</p>\n</div>\n\n<div class=\"script-card\"><h4>9.4 &middot; Neighbor complaints</h4>\n<ul>\n<li>Provide the consent form showing permission to film on the property.</li>\n<li>Show your Centific company identification and explain the company's mission.</li>\n<li>Make sure the authorization banner is visible at the site.</li>\n</ul>\n<p><strong>Report it.</strong> Every neighbor interaction goes to the project lead the same night, even the friendly ones. A pattern on one street matters more than any single conversation.</p>\n</div>\n\n<div class=\"script-card\"><h4>9.5 &middot; A participant appears intoxicated</h4>\n<div class=\"script\">\"We're not going to be able to continue tonight. I'm going to pack up here. Take care.\"</div>\n<p>Then pack down and leave. Do not explain, do not debate, do not discuss payment, do not offer to reschedule.</p>\n<div class=\"why\"><strong>Why.</strong> Giving a reason gives someone something to argue with. Stay neutral. Never use the words \"drunk,\" \"high,\" or \"intoxicated\" — to them or in your log. Describe behavior in your escalation, not conclusions.</div>\n<p><strong>Escalate:</strong> contact your PC as soon as you are out of the property. Same night.</p>\n</div>\n\n<div class=\"script-card\"><h4>9.6 &middot; Inappropriate conduct toward you</h4>\n<p>Redirect once, firmly:</p>\n<div class=\"script\">\"I'm here in a professional capacity, so let's keep the focus on the session.\"</div>\n<p>If it continues:</p>\n<div class=\"script\">\"I need this to stay professional. If that's not workable, I'm going to pack up and go.\"</div>\n<p><strong>Then do it.</strong> One clear redirect, then a clean line, then you leave. You do not owe a completed session to anyone who has made you uncomfortable, and you will not be asked to justify the decision.</p>\n<p><strong>Tell your teammate straight away</strong> — do not wait until you are back in the car. You pack up and leave together, and they can call the PC while you get the kit out.</p>\n<div class=\"dont\"><strong>Don't:</strong> laugh it off or play along &middot; over-explain or negotiate the boundary &middot; stay out of politeness &middot; wait until it escalates further to act.</div>\n<p><strong>Escalate:</strong> Ritu and Sander, the same night, and document it in neutral observable terms.</p>\n</div>\n\n<h2>Escalation and reporting</h2>\n<table class=\"tbl\">\n<tr><th>Situation</th><th>Action</th></tr>\n<tr><td>Any safety concern, an unfit partner, or an incident</td><td>Email <strong>ben_prod_twilight@centific.com</strong></td></tr>\n<tr><td>An immediate safety threat</td><td><strong>Call 911</strong></td></tr>\n</table>\n\n<h2>Your own safety comes first</h2>\n<p>This is the shortest section in the course and the one that matters most.</p>\n<p><strong>You may leave a property at any time, for any reason, including one you cannot articulate.</strong> If a street, a house, or a person feels wrong, you do not need to justify it, get permission, or finish the session first. Leave, get somewhere safe, and report it from there. No capture on this project is worth your safety.</p>\n<p><strong>And you leave together.</strong> If either of you wants to go, you both go. Neither of you has to talk the other into it, and neither of you finishes a session alone.</p>\n<div class=\"callout\"><div class=\"c-ic\">&#9432;</div><div class=\"c-tx\"><strong>You must state the reason.</strong> A team may stop a session for any reason at all, and nobody will second-guess the decision — but you have to say what it was in your message to Ritu and Sander. \"We left\" is not enough on its own; \"we left because a man was shouting from the next driveway\" is. The reason is what lets the team spot a pattern on a street, or protect you if it comes up later.</div></div>\n", "gate": "quiz"}, {"id": "hourspay", "ic": "&#128176;", "title": "Your Hours and Pay", "sub": "When your paid time starts, your timesheet, and how you're paid.", "min": 6, "body": "\n<h2>What you are paid for</h2>\n<p>Your agency pays you for <strong>all hours worked during collection sessions</strong>, and for <strong>any training hours confirmed by the Twilight PM team</strong>. Log both in Samay against the Project ID your Project Manager gives you.</p>\n<h2>Mileage</h2>\n<p>You are reimbursed for mileage <strong>from the Redmond office to the participant's home and back to the office</strong>.</p>\n<p>You are <strong>not</strong> reimbursed for your own commute — home to the office at the start of your shift, or the office to home at the end of it. Only the driving between the office and a participant property counts.</p>\n<h2>Your timesheet</h2>\n<p>Go to <strong>timesheet.centific.com</strong> and choose \"Login by SSO.\" Use your Centific v-dash email credential and password. Your moderator email address was provided by Centific IT in your welcome letter.</p>\n<div class=\"video-embed\"><div class=\"video-fallback\">&#9654; Moderator Fundamentals — Samay Timesheet Walkthrough<br><a href=\"https://digitaltechedge.sharepoint.com/:v:/r/sites/Project_Twilight_Moderators/Shared%20Documents/Moderator%20Training%20Materials/Moderator%20Fundamentals%20-%20Samay%20Timesheet%20Walkthrough.mp4?d=w4ae0852611734270a23b6177056877fd&csf=1&web=1&e=WDgTA4\" target=\"_blank\" rel=\"noopener\">Watch on the Moderator SharePoint &#8599;</a><br><span style=\"font-size:11.5px;\">Sign in with your Centific credentials.</span></div></div>\n<p><strong>Your Samay hours become your paycheck.</strong> The approved-hours figure your Project Manager submits is built from what you logged. Late or missing entries delay your own payment.</p>\n\n<h2>You work with Centific. Your agency employs you.</h2>\n<p>Two different relationships, and keeping them clear protects you. Centific directs the work: what the sessions need, how the data is captured, what good quality looks like. Your agency is your employer — they hold your contract, they pay you, and they handle your terms. Your Centific email starts with v- for exactly this reason: it marks you as working through a vendor rather than as staff.</p>\n<p><strong>How to describe the work:</strong> you are a moderator working with Centific, not for Centific. To participants, you moderate on behalf of Centific. On LinkedIn or a CV, list your agency as your employer and describe the work as data collection moderating carried out on behalf of Centific. Do not list Centific as your employer or give yourself a Centific job title.</p>\n<table class=\"tbl\">\n<tr><th>If it is about...</th><th>Ask</th></tr>\n<tr><td>Doing the work — guidelines, tools, scheduling, quality, support mid-session</td><td>Centific (your PM)</td></tr>\n<tr><td>Your employment — pay, rate, contract, hours, time off, benefits, taxes, future work</td><td>Your agency</td></tr>\n</table>\n<p>Centific staff cannot change your rate, approve a bonus, negotiate more hours, or promise future work. If you raise these they will point you back to your agency. That is not a brush-off — they have no authority to act, and your agency does.</p>\n\n<h2>How you are paid</h2>\n<p>As a C2C moderator your contract is with your agency. You log hours in Samay, you reconcile them with your Project Manager, the PM approves them at the close of each two-week period, and Centific reports them onward to your agency. Your agency issues payment.</p>\n<p>Timing depends on your agency. If yours pays biweekly, the standard schedule is:</p>\n<table class=\"tbl\">\n<tr><th>Work period</th><th>Paid around</th></tr>\n<tr><td>1st – 15th</td><td>30th / 31st of that month</td></tr>\n<tr><td>16th – end of month</td><td>15th of the following month</td></tr>\n</table>\n<table class=\"tbl\">\n<tr><th>Question</th><th>Ask</th></tr>\n<tr><td>\"My hours don't look right\"</td><td>Your Project Manager</td></tr>\n<tr><td>\"When will I be paid?\"</td><td>Your agency</td></tr>\n<tr><td>\"What is my rate?\"</td><td>Your agency</td></tr>\n<tr><td>\"Can I get a raise, a bonus, or more hours?\"</td><td>Your agency</td></tr>\n</table>\n", "gate": "quiz"}];
const MOD_QUESTIONS_DEFAULT = {"centific": [{"q": "Which best describes what Centific does?", "opts": ["It builds and sells its own consumer AI assistant", "It is a market research firm that runs opinion polls", "It creates and collects high-quality human data, and adds expert human judgment, so companies can train and evaluate AI systems", "It is a translation agency"], "a": 2}, {"q": "A participant asks which company will receive the recordings. What do you do?", "opts": ["Name the client, since the participant has already signed a consent form", "Say you are not able to share the client name, and explain what the data is used for instead", "Hint at the industry so they can work it out", "Tell them you have no idea what the data is for"], "a": 1}, {"q": "What is the data collection team measured on?", "opts": ["The total number of sessions recorded, regardless of outcome", "How much data passes QA and can actually be used", "How quickly participants are recruited", "The number of languages covered in a single project"], "a": 1}, {"q": "Which of these is NOT part of the moderator role?", "opts": ["Checking equipment and tooling before the session starts", "Keeping the session within the project format", "Deciding whether a recording is accepted or rejected", "Flagging problems to your point of contact after a session"], "a": 2}], "fundamentals": [{"q": "What is the only reason you go inside a participant's home during a Twilight session?", "opts": ["To use the restroom if needed", "To reach the Wi-Fi modem", "To set up an indoor calibration shot", "To confirm the participant's ID indoors"], "a": 1}, {"q": "You're about to unload equipment. What must you confirm first?", "opts": ["That the participant has signed the form a second time", "That you are at the right address and speaking to the booked participant", "That the neighbors are aware of the session", "That your agency has approved the visit"], "a": 1}, {"q": "A participant asks a policy question you weren't b async function apiGet(url){

  if(!r.ok) throw new Error('GET '+r.status);

}

    email: String(pick(['email','Email','EMAIL'])).trim().toLowerCase(),
    name: pick(['name','Name','NAME']),
    role: (pick(['role','Role','ROLE'])||'moderator').toString().toLowerCase(),

async function saveProgress(moduleId, status, score){
  if(!LIVE || !/^https?:\/\//.test(BACKEND.saveProgress)) return;
  try{
    const res = await fetch(BACKEND.saveProgress, {method:'POST', headers:{'Content-Type':'text/plain'},
      body: JSON.stringify({email: ME.email, moduleId, status, score: (score==null?'':score)})});
    // Fire-and-forget by design (a failed save just means the moderator
    // re-does that checkbox next load) -- but DO log the HTTP status, since
    // fetch() only rejects on a network-level failure, never on a PA flow
    // returning 400/401/etc. Without this, a misconfigured flow (wrong
    // table binding, wiped Advanced Parameters after a Save-As clone) fails
    // 100% silently -- the UI still shows progress because doneIds is
    // updated in-memory regardless of whether the write actually landed.
    if(!res.ok){
      console.warn('[Twilight] saveProgress returned', res.status, '-- check the SaveProgress flow (Table binding / Advanced Parameters / trigger set to Anyone). Progress is NOT confirmed saved to Excel.', {moduleId, status, score});
    } else {
      console.log('[Twilight] saveProgress OK for', moduleId);
    }
  }catch(e){ console.error('[Twilight] saveProgress network failure (CORS, DNS, or offline) for', moduleId, ':', e); }
}
function progressFor(email){
  if(LIVE && window._PROGRESS){
    const rows = window._PROGRESS.filter(r => String(r.Email||r.email||'').toLowerCase() === email.toLowerCase());
    const doneIds = new Set(rows.filter(r => String(r.Status||r.status||'')==='done' && VALID_IDS.has(r.ModuleID||r.moduleId)).map(r=>r.ModuleID||r.moduleId));
    const finalRow = rows.find(r => (r.ModuleID||r.moduleId) === 'final_check');
    const finalScore = finalRow ? Number(finalRow.Score||finalRow.score||0) : null;
    return {doneIds, finalScore};
  }
  // demo mode: derive a plausible in-progress state for the test moderator
  if(email === 'test.mod@centific.com'){
    return {doneIds: new Set(['welcome','centific']), finalScore: null};
  }
  return {doneIds: new Set(), finalScore: null};

  const totalReal = MODULES.length;
  const certified = p.doneIds.size >= totalReal && p.finalScore !== null && p.finalScore >= FINAL_CHECK_PASS_PCT;
  let status = 'not_started';
  if(p.doneIds.size > 0) status = 'in_progress';
  if(p.doneIds.size >= totalReal && (p.finalScore === null || p.finalScore < FINAL_CHECK_PASS_PCT)) status = 'awaiting_final';
  if(certified) status = 'certified';
  return {email:r.email, name:r.name, loc:r.loc, done:p.doneIds.size, finalScore:p.finalScore, status, certified};
}

// ── GATING ───────────────────────────────────────────────────────────────────
function isModuleDone(id){ return ME.doneIds.has(id); }
function moduleUnlocked(i){ return i===0 || isModuleDone(MODULES[i-1].id); }
function allModulesDone(){ return MODULES.every(m => isModuleDone(m.id)); }
function isCertified(){ return allModulesDone() && ME.finalScore !== null && ME.finalScore >= FINAL_CHECK_PASS_PCT; }

function applyProfile(rec){

         doneIds: p.doneIds, finalScore: p.finalScore };

async function doLogin(){
  const el = document.getElementById('emailField');
  const email = (el.value||'').trim().toLowerCase();
  const err = document.getElementById('lgErr');
  if(!/^[^@\s]+@centific\.com$/.test(email)){ err.textContent = 'Please enter your @centific.com email address.'; return; }

  const rec = findUser(email);
  if(!rec){ err.textContent = "That email isn't on the moderator list yet — check with your Project Manager."; return; }
  err.textContent = '';
  applyProfile(rec);
  restoreLocalSession(email);
  setLastLogin(email);
  startApp(rec.role);
}

function vPath(){

  let hero;
  if(certified){
    hero = `<div class="hero-box certified"><div class="pill pill-green" style="margin-bottom:10px;">&#10003; Cleared for on-site training</div>
      <div class="hero-title2">You're certified, ${ME.name.split(' ')[0]}.</div>
      <div class="hero-sub2">All ${MODULES.length} modules complete and the final check passed at ${ME.finalScore}%. Your Project Manager will confirm your on-site training date.</div></div>`;
  } else if(allDoneNoFinal){
    hero = `<div class="hero-box"><div class="hero-title2">One step left, ${ME.name.split(' ')[0]}.</div>
      <div class="hero-sub2">All ${MODULES.length} modules are complete. Pass the final check (${FINAL_CHECK_PASS_PCT}%, unlimited retakes) to be cleared for on-site training.</div>
      <div class="progress-track"><div class="progress-fill" style="width:100%"></div></div>
      <div class="progress-label">${doneCount} of ${total} modules complete</div>
      <button class="btn btn-primary" style="width:auto;margin-top:14px;" onclick="openFinalCheck()">Take the final check &rarr;</button></div>`;
  } else if(doneCount===0){
    hero = `<div class="hero-box"><div class="hero-title2">Welcome — let's get you ready.</div>
      <div class="hero-sub2">${MODULES.length} modules, gated in order, ~${TOTAL_MIN} min total. Every module has a Back button and stays open for revisiting once you've completed it.</div>
      <div class="progress-track"><div class="progress-fill" style="width:0%"></div></div>
      <div class="progress-label">0 of ${total} modules complete</div></div>`;
  } else {
    hero = `<div class="hero-box"><div class="hero-title2">Welcome back, ${ME.name.split(' ')[0]}.</div>
      <div class="hero-sub2">Pick up where you left off.</div>
      <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
      <div class="progress-label">${doneCount} of ${total} modules complete</div></div>`;
  }
  const steps = MODULES.map((m,i) => {
    const done = isModuleDone(m.id);
    const unlocked = moduleUnlocked(i);
    const current = unlocked && !done;
    const dotClass = done ? 'done' : (current ? 'current' : 'locked');
    const dotContent = done ? '&#10003;' : (i+1);

      </div>
    </div>`;

  return `<h1 class="page-h1">My Learning Path</h1><p class="page-sub">${doneCount} of ${total} complete &middot; ~${TOTAL_MIN} min total</p>

function openModule(i){ CUR_MOD = i; VIEW = 'module'; renderNavTabs(); renderView(); window.scrollTo(0,0); }
function backToPath(){ VIEW='path'; renderNavTabs(); renderView(); window.scrollTo(0,0); }
function continueFromModule(){
  if(CUR_MOD < MODULES.length-1){ openModule(CUR_MOD+1); }
  else { backToPath(); }
